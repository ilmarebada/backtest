name: 데이터 업데이트 & 배포

on:
  schedule:
    - cron: "7 23 * * 1-5"   # 평일 23:07 UTC = 한국시간 오전 8시 7분 (미국장 마감 후)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      add_tickers:
        description: "추가할 티커 (쉼표로 구분, 예: TSLA,NVDA)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - name: 주가 데이터 받기
        run: python scripts/fetch_data.py "${{ github.event.inputs.add_tickers }}"
      - name: 추가한 티커 목록 저장(주가 데이터는 커밋하지 않음)
        if: github.event.inputs.add_tickers != ''
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tickers.txt
          git diff --cached --quiet || git commit -m "티커 추가: ${{ github.event.inputs.add_tickers }}"
          git push
      - uses: actions/configure-pages@v5
      - name: 배포할 파일 모으기
        run: mkdir -p _site && cp -r index.html engine.js data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
