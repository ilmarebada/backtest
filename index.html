<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무한매수법 백테스터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;800&family=Red+Hat+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: 차분한 트레이딩 데스크, 숫자가 주인공
   IDEA: 증권사 HTS의 전략 테스트 패널
   PICTURE: 전략 vs 단순보유 자산 곡선 + 핵심 지표
   COLOUR/TYPE: 네이비 바탕, 청록=전략, 노랑=단순보유, 빨강=손실 / Red Hat
   LAYOUT: 좌측 조건 패널, 우측 결과. 600px 이하 세로 배치 */
:root{color-scheme:dark;--bg:#0b1433;--panel:#121d45;--line:#243166;--ink:#e9edff;--mute:#9aa6d6;--a:#4fc1c6;--b:#f7e463;--bad:#e8452c;--blue:#3b4fd8}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Red Hat Text",system-ui,sans-serif;overflow-x:clip}
h1{font:800 clamp(28px,4vw,44px)/1.05 "Red Hat Display",sans-serif;margin:0 0 6px;text-wrap:balance}
h2{font:600 20px/1.2 "Red Hat Display",sans-serif;margin:0 0 12px}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(20px,3vw,40px) max(4vw,16px)}
.sub{color:var(--mute);margin:0 0 24px}
.grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;font:16px "Red Hat Text",sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
input:focus,select:focus,button:focus{outline:2px solid var(--a);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset{border:0;padding:0;margin:16px 0 0;border-top:1px solid var(--line)}
legend{font-weight:600;padding:12px 0 0}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}.chk input{width:auto;min-height:0}
button{font:600 16px "Red Hat Text",sans-serif;border:0;border-radius:10px;min-height:48px;padding:0 18px;cursor:pointer}
.go{width:100%;margin-top:18px;background:var(--a);color:#06202a}
.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);min-height:40px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font:800 clamp(22px,2.6vw,32px)/1.1 "Red Hat Display",sans-serif;white-space:nowrap}
.kpi>span{font-size:13px;color:var(--mute)}.kpi i{font-style:normal;font-size:13px;color:var(--b);display:block}
.fig{position:relative;height:340px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin-top:8px}
.legend s{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px;text-decoration:none}
.scroll{overflow-x:auto;max-height:420px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--panel)}
td:first-child,th:first-child{text-align:left}
.pos{color:var(--a)}.neg{color:var(--bad)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 10px}
.tabs button{background:transparent;color:var(--mute);border:1px solid var(--line);min-height:40px;font-size:14px}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.msg{padding:14px;border-radius:10px;background:#1a2550;color:var(--mute);margin-bottom:16px}
.note{font-size:13px;color:var(--mute);margin-top:12px}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.fig{height:260px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>무한매수법 V4.0 백테스터</h1>
  <p class="sub">티커와 기간, 조건을 넣고 실행하면 과거 데이터로 전략을 검증해요. 데이터는 매일 자동 업데이트돼요.</p>
  <div class="grid">
    <form class="panel" id="f">
      <label for="tk">티커</label>
      <select id="tk"></select>
      <label for="csv">또는 CSV 파일 올리기 (야후 형식)</label>
      <input type="file" id="csv" accept=".csv">
      <div class="two">
        <div><label for="from">시작일</label><input type="date" id="from" value="2015-01-01"></div>
        <div><label for="to">종료일</label><input type="date" id="to"></div>
      </div>
      <fieldset><legend>무한매수법 V4.0</legend>
        <div class="two">
          <div><label for="seed">원금($)</label><input type="number" id="seed" value="10000" min="100"></div>
          <div><label for="splits">분할 수</label><select id="splits"><option>20</option><option>30</option><option selected>40</option></select></div>
          <div><label for="targetPct">목표 수익률·별% (%)</label><input type="number" id="targetPct" value="20" step="0.5"></div>
          <div><label for="feePct">수수료(%)</label><input type="number" id="feePct" value="0.07" step="0.01"></div>
        </div>
        <p class="note">목표%는 TQQQ 15, SOXL 20이 기본이에요.</p>
        <label class="chk"><input type="checkbox" id="ladder" checked> 하락 대비 추가 LOC(사다리) 매수</label>
        <label class="chk"><input type="checkbox" id="compound" checked> 사이클 종료 후 복리로 재시작</label>
        <label for="firstQty">처음매수 수량</label>
        <select id="firstQty"><option value="prev">1회매수금 ÷ 전일종가</option><option value="big">1회매수금 ÷ 큰수(전일종가+10%)</option></select>
        <label for="bigPct">큰수 매수 한도 % (급등일 미체결 반영, 0 = 끔)</label>
        <input type="number" id="bigPct" value="0" min="0" max="20">
      </fieldset>
      <fieldset><legend>추가 필터 (선택)</legend>
        <label for="maFilter">새 사이클 시작 조건: 종가가 N일선 위 (0 = 끔)</label>
        <input type="number" id="maFilter" value="0" min="0">
      </fieldset>
      <button class="go" type="submit">백테스트 실행</button>
      <p class="note">LOC는 종가 체결, 3/4 지정가 매도는 장중 고가 도달 시 체결로 가정해요.</p>
    </form>

    <section>
      <div class="msg" id="msg">왼쪽에서 조건을 고르고 실행을 눌러주세요.</div>
      <div id="out" hidden>
        <div class="kpis" id="kpis"></div>
        <div class="msg" id="state" hidden></div>
        <div class="panel">
          <h2 id="title"></h2>
          <div class="fig"><svg id="chart" role="img" aria-label="자산 곡선"></svg></div>
          <div class="legend"><span><s style="background:var(--a)"></s>무한매수법</span><span><s style="background:var(--b)"></s>단순 보유</span><label class="chk"><input type="checkbox" id="logScale" checked> 로그 스케일</label></div>
        </div>
        <div class="tabs" role="tablist">
          <button type="button" class="on" data-t="cycles">사이클</button>
          <button type="button" data-t="trades">매매 내역</button>
          <button type="button" data-t="history">실행 기록 비교</button>
        </div>
        <div class="panel"><div class="scroll" id="tbl"></div></div>
        <p class="note">과거 성과가 미래 수익을 보장하지 않아요. 배당·세금·환율은 반영하지 않았어요.</p>
      </div>
    </section>
  </div>
</div>
<script src="engine.js"></script>
<script>
{
const $ = id => document.getElementById(id);
const fmt = (v, d = 0) => v.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d });
const usd = v => (v < 0 ? '−$' : '$') + fmt(Math.abs(v));
const pct = v => `<span class="${v >= 0 ? 'pos' : 'neg'}">${v >= 0 ? '+' : ''}${fmt(v, 1)}%</span>`;
let data = {}, csvBars = null, last = null, tab = 'cycles';
const history = [];
$('to').value = new Date().toISOString().slice(0, 10);

fetch('data/tickers.json').then(r => r.json()).then(list => {
  const groups = [
    ['3배 · 지수', { TQQQ: '나스닥100', UPRO: 'S&P500', SPXL: 'S&P500', UDOW: '다우', TNA: '러셀2000', URTY: '러셀2000', MIDU: '중형주' }],
    ['3배 · 섹터/테마', { SOXL: '반도체', TECL: '기술', FNGU: '빅테크', BULZ: '혁신기술', FAS: '금융', DPST: '지역은행', LABU: '바이오', CURE: '헬스케어', DFEN: '방산', DRN: '리츠', NAIL: '주택건설', HIBL: '고베타', WEBL: '인터넷', RETL: '리테일', UTSL: '유틸리티', WANT: '소비재', DUSL: '산업재', PILL: '제약', TPOR: '운송', YINN: '중국', TMF: '미 장기채' }],
    ['2배', { QLD: '나스닥100', SSO: 'S&P500', USD: '반도체', ROM: '기술', NVDL: '엔비디아', TSLL: '테슬라' }],
    ['1배 (비교용)', { QQQ: '나스닥100', SPY: 'S&P500', SOXX: '반도체', SMH: '반도체' }]
  ];
  const known = new Set(groups.flatMap(g => Object.keys(g[1])));
  const opt = (t, n) => `<option value="${t}"${t === 'SOXL' ? ' selected' : ''}>${t}${n ? ' · ' + n : ''}</option>`;
  const etc = list.filter(t => !known.has(t));
  $('tk').innerHTML = groups.map(([g, m]) => {
    const items = Object.keys(m).filter(t => list.includes(t));
    return items.length ? `<optgroup label="${g}">${items.map(t => opt(t, m[t])).join('')}</optgroup>` : '';
  }).join('') + (etc.length ? `<optgroup label="기타">${etc.map(t => opt(t)).join('')}</optgroup>` : '');
}).catch(() => { $('tk').innerHTML = '<option value="">(데이터 없음: CSV를 올려주세요)</option>'; });

$('tk').onchange = () => { $('targetPct').value = $('tk').value === 'SOXL' ? 20 : 15; };
$('csv').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const rows = (await f.text()).trim().split(/\r?\n/), head = rows.shift().split(',').map(s => s.trim().toLowerCase());
  const ix = k => head.indexOf(k);
  csvBars = rows.map(r => r.split(',')).map(c => ({ d: c[ix('date')], o: +c[ix('open')], h: +c[ix('high')], l: +c[ix('low')], c: +c[ix('close')] }))
    .filter(b => b.c > 0).sort((a, b) => a.d < b.d ? -1 : 1);
  $('msg').textContent = `${f.name}: ${csvBars.length}일치 데이터를 읽었어요.`;
};

async function load(t) {
  if (data[t]) return data[t];
  const j = await (await fetch(`data/${t}.json`)).json();
  return data[t] = j.rows.map(r => ({ d: r[0], o: r[1], h: r[2], l: r[3], c: r[4] }));
}

$('f').onsubmit = async e => {
  e.preventDefault();
  try {
    const t = csvBars ? ($('csv').files[0]?.name.replace('.csv', '') || 'CSV') : $('tk').value;
    let bars = csvBars || await load(t);
    const opt = { from: $('from').value, to: $('to').value, ladder: $('ladder').checked, compound: $('compound').checked, firstQty: $('firstQty').value };
    for (const k of ['seed', 'splits', 'targetPct', 'feePct', 'maFilter', 'bigPct']) opt[k] = +$(k).value;
    last = IBM.run(bars, opt); last.ticker = t;
    last.range = `${last.equity[0].d} ~ ${last.equity[last.equity.length - 1].d}`;
    history.unshift({ t, range: last.range, opt, s: last.stats, bh: last.bh });
    $('msg').hidden = true; $('out').hidden = false; render();
  } catch (err) { $('msg').hidden = false; $('msg').textContent = '오류: ' + err.message; }
};

function render() {
  const s = last.stats, bh = last.bh;
  $('title').textContent = `${last.ticker} · ${last.range}`;
  $('kpis').innerHTML = [
    ['최종 자산', '$' + fmt(s.final), `단순보유 $${fmt(bh.final)}`],
    s.years >= 1 ? ['연평균 수익률', pct(s.cagr), `단순보유 ${fmt(bh.cagr, 1)}% · 총 ${fmt(s.ret)}%`] : ['기간 수익률', pct(s.ret), `단순보유 ${fmt(bh.ret, 1)}%`],
    ['최대 낙폭(MDD)', `<span class="neg">${fmt(s.mdd, 1)}%</span>`, `단순보유 ${fmt(bh.mdd, 1)}%`],
    ['완료 사이클 · 승률', `${s.cycles}회 · ${fmt(s.winRate)}%`, `평균 ${fmt(s.avgDays)}거래일 · 리버스 ${s.reverses}회`]
  ].map(k => `<div class="kpi"><span>${k[0]}</span><b>${k[1]}</b><i>${k[2]}</i></div>`).join('');
  const st = last.state;
  $('state').hidden = !st;
  if (st) $('state').innerHTML = `<b>마지막 날 상태</b> · ${st.mode === 'reverse' ? '리버스모드' : '일반모드'} · T ${fmt(st.T, 3)} · 보유 ${st.shares}주 · 평단 $${fmt(st.avg, 2)} · 잔금 $${fmt(st.cash)} · 다음 ${st.mode === 'reverse' ? '쿼터매수금' : '1회매수금'} $${fmt(st.unit)}`;
  draw(); table();
}

const svg = $('chart');
function draw() {
  if (!last) return;
  const W = svg.clientWidth, H = svg.clientHeight, L = 56, R = 10, T = 10, B = 26, log = $('logScale').checked;
  const a = last.equity, b = last.bh.equity, n = a.length;
  const f = v => log ? Math.log(Math.max(v, 1)) : v;
  const all = a.concat(b).map(e => f(e.v)), lo = Math.min(...all), hi = Math.max(...all);
  const x = i => L + i / (n - 1) * (W - L - R), y = v => T + (1 - (f(v) - lo) / (hi - lo || 1)) * (H - T - B);
  const path = arr => arr.map((e, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(e.v).toFixed(1)).join('');
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const fv = lo + (hi - lo) * k / 4, v = log ? Math.exp(fv) : fv, yy = T + (1 - k / 4) * (H - T - B);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#243166"/><text x="${L - 6}" y="${yy + 4}" fill="#9aa6d6" font-size="12" text-anchor="end">$${v >= 1e6 ? fmt(v / 1e6, 1) + 'M' : fmt(v / 1e3, 0) + 'k'}</text>`;
  }
  const ticks = W < 520 ? 2 : 5;
  for (let k = 0; k <= ticks; k++) { const i = Math.round((n - 1) * k / ticks); g += `<text x="${x(i)}" y="${H - 6}" fill="#9aa6d6" font-size="12" text-anchor="${k === 0 ? 'start' : k === ticks ? 'end' : 'middle'}">${a[i].d.slice(0, W < 520 ? 4 : 7)}</text>`; }
  svg.innerHTML = g + `<path d="${path(b)}" fill="none" stroke="#f7e463" stroke-width="1.5" opacity=".85"/><path d="${path(a)}" fill="none" stroke="#4fc1c6" stroke-width="2"/>`;
}
const ro = new ResizeObserver(draw); ro.observe(svg);
$('logScale').onchange = draw;

document.querySelectorAll('.tabs button').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === btn)); tab = btn.dataset.t; table();
});
function table() {
  let h = '';
  if (tab === 'cycles') {
    h = '<table><thead><tr><th>시작</th><th>종료</th><th>거래일</th><th>사이클 원금</th><th>손익</th><th>수익률</th><th>쿼터매도</th><th>리버스</th></tr></thead><tbody>' +
      last.cycles.slice().reverse().map(c => `<tr><td>${c.start}</td><td>${c.end}</td><td>${c.days}</td><td>$${fmt(c.seed)}</td><td>${c.ret == null ? '-' : usd(c.pnl)}</td><td>${c.ret == null ? '-' : pct(c.ret)}</td><td>${c.quarters}회</td><td>${c.reverses}회</td></tr>`).join('') + '</tbody></table>';
  } else if (tab === 'trades') {
    h = '<table><thead><tr><th>날짜(미국)</th><th>구분</th><th>사유</th><th>T 변화</th><th>T</th><th>가격</th><th>수량</th><th>금액</th></tr></thead><tbody>' +
      last.trades.slice(-500).reverse().map(t => `<tr><td>${t.d}</td><td class="${t.side === '매수' ? 'pos' : 'neg'}">${t.side}</td><td>${t.why}</td><td>${t.dT}</td><td>${fmt(t.T, 3)}</td><td>$${fmt(t.price, 2)}</td><td>${t.q}</td><td>$${fmt(t.price * t.q)}</td></tr>`).join('') + '</tbody></table>';
  } else {
    h = '<table><thead><tr><th>티커</th><th>기간</th><th>조건</th><th>CAGR</th><th>MDD</th><th>승률</th><th>단순보유 CAGR</th></tr></thead><tbody>' +
      history.map(r => `<tr><td>${r.t}</td><td>${r.range}</td><td>${r.opt.splits}분할 · ${r.opt.targetPct}%${r.opt.ladder ? ' · 사다리' : ''}${r.opt.compound ? ' · 복리' : ' · 단리'}${r.opt.maFilter ? ' · ' + r.opt.maFilter + '일선' : ''}</td><td>${pct(r.s.cagr)}</td><td class="neg">${fmt(r.s.mdd, 1)}%</td><td>${fmt(r.s.winRate)}%</td><td>${fmt(r.bh.cagr, 1)}%</td></tr>`).join('') + '</tbody></table>';
  }
  $('tbl').innerHTML = h;
}
}
</script>
</body>
</html>
